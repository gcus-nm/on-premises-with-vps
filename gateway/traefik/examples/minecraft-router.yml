# Disabled example. The default gateway Compose does not run mc-router or expose
# the minecraft entryPoint. Re-enable both explicitly before using this file.
tcp:
  routers:
    minecraft:
      entryPoints:
        - minecraft
      rule: HostSNI(`*`)
      service: minecraft-router

  services:
    minecraft-router:
      loadBalancer:
        servers:
          - address: mc-router:25565
