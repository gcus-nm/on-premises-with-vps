openapi: 3.1.0
info:
  title: OCI Relay Control API
  version: 1.3.0
  description: Private API shared by the Web UI and non-interactive CLI.
servers:
  - url: http://127.0.0.1:8081
security:
  - basicAuth: []
paths:
  /api/state:
    get:
      operationId: getState
      responses:
        '200':
          description: Desired/applied state, audit entries, and a CSRF token
          content: { application/json: { schema: { type: object } } }
  /api/preflight:
    get:
      operationId: runPreflight
      responses:
        '200':
          description: Environment checks
          content: { application/json: { schema: { type: object } } }
  /api/routes/validate:
    post:
      operationId: validateRouteCreate
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody: { $ref: '#/components/requestBodies/Route' }
      responses:
        '200':
          description: No-change validation and affected-target summary
          content: { application/json: { schema: { type: object } } }
  /api/routes:
    post:
      operationId: createRoute
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Route' }
      responses:
        '201':
          description: Route staged; OCI is unchanged until plan/apply
          content: { application/json: { schema: { type: object } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/plan:
    post:
      operationId: createTerraformPlan
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Allowlisted Terraform plan metadata
          content: { application/json: { schema: { type: object } } }
  /api/apply:
    post:
      operationId: applyTerraformPlan
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties: { confirmation: { const: APPLY } }
      responses:
        '200':
          description: Terraform and relay synchronization completed
          content: { application/json: { schema: { type: object } } }
        '502':
          description: Failed or partially failed operation; response identifies completed work
          content: { application/json: { schema: { type: object } } }
  /api/sync:
    post:
      operationId: synchronizeRelay
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Relay synchronization result
          content: { application/json: { schema: { type: object } } }
  /api/wireguard:
    get:
      operationId: getWireGuardState
      responses:
        '200':
          description: Peer inventory, live status, reusable access presets, access_groups, access_revision, and the next available address. Peer entries include direct_presets, access_groups, and access_paths in addition to effective access_presets
          content: { application/json: { schema: { type: object } } }
  /api/wireguard/peers:
    post:
      operationId: createWireGuardPeer
      description: >-
        Creates a peer immediately. The private client profile and QR image are returned once
        with Cache-Control no-store and are never persisted by Relay Control.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, address]
              properties:
                name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
                address: { type: string, format: ipv4 }
      responses:
        '201':
          description: Peer created and one-time client artifacts issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WireGuardArtifact' }
  /api/wireguard/peers/{name}/rotate:
    post:
      operationId: rotateWireGuardPeer
      description: Invalidates the previous client key and issues new one-time artifacts.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/PeerName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties: { confirmation: { const: ROTATE } }
      responses:
        '200':
          description: Peer key rotated and one-time client artifacts issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WireGuardArtifact' }
  /api/wireguard/peers/{name}/access-presets:
    put:
      operationId: setWireGuardPeerAccessPresets
      description: >-
        Atomically replaces only the directly assigned access presets of one source Peer,
        preserving group assignments, and immediately updates the effective relay ACL.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/PeerName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preset_names]
              properties:
                preset_names:
                  type: array
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/AccessPresetName' }
      responses:
        '200':
          description: Peer assignments replaced and relay ACL updated
          content: { application/json: { schema: { type: object } } }
  /api/wireguard/access-preview:
    post:
      operationId: previewWireGuardAccess
      description: Validates a proposed access change without writing state. Returns the revision required for applying it and effective permission additions/removals per Peer. Validation errors return 400.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [ { $ref: '#/components/schemas/AccessChange' } ]
              required: [action]
      responses:
        '200':
          description: Validated change, current revision and affected Peers
          content: { application/json: { schema: { $ref: '#/components/schemas/AccessPreview' } } }
  /api/wireguard/access-groups:
    post:
      operationId: createWireGuardAccessGroup
      description: Creates a group and optional new presets in one transaction. Uses the revision from access-preview.
      parameters: [ { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessChange' }
      responses:
        '201': { description: Group and presets saved and effective ACL applied }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/wireguard/access-groups/{name}:
    parameters: [ { $ref: '#/components/parameters/AccessPresetName' } ]
    put:
      operationId: updateWireGuardAccessGroup
      description: Replaces group members, optionally renames the group and creates presets. Updates all parent and Peer references and applies all affected ACLs in one transaction.
      parameters: [ { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessChange' }
      responses:
        '200': { description: Group saved and effective ACL applied }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWireGuardAccessGroup
      description: Rejects deletion if referenced by any Peer or parent group. Deleting a group does not delete its presets or child groups.
      parameters: [ { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: string }
      responses:
        '200': { description: Unreferenced group deleted }
        '400': { description: Group is still referenced }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/wireguard/peers/{name}/access:
    put:
      operationId: setWireGuardPeerAccess
      description: Replaces direct preset and group assignments together; applies their recursive union. Requires the revision from access-preview with action assign and peer_name.
      parameters: [ { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/PeerName' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset_names, group_names, revision]
              properties:
                preset_names: { type: array, items: { $ref: '#/components/schemas/AccessItemName' } }
                group_names: { type: array, items: { $ref: '#/components/schemas/AccessItemName' } }
                revision: { type: string }
      responses:
        '200': { description: Direct assignments replaced and effective ACL applied }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/wireguard/access-presets:
    post:
      operationId: createWireGuardAccessPreset
      description: Creates a reusable destination preset without assigning source Peers.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody: { $ref: '#/components/requestBodies/AccessPreset' }
      responses:
        '201':
          description: Access preset created on the relay
          content: { application/json: { schema: { type: object } } }
  /api/wireguard/access-presets/{name}:
    put:
      operationId: updateWireGuardAccessPreset
      description: >-
        Updates the preset name or destination while preserving all current Peer assignments.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/AccessPresetName'
      requestBody: { $ref: '#/components/requestBodies/AccessPreset' }
      responses:
        '200':
          description: Access preset updated on the relay
          content: { application/json: { schema: { type: object } } }
    delete:
      operationId: deleteWireGuardAccessPreset
      description: Deletes an unreferenced preset. Rejects deletion while referenced by any Peer or group.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/AccessPresetName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties: { confirmation: { const: DELETE } }
      responses:
        '200':
          description: Access preset deleted from the relay
          content: { application/json: { schema: { type: object } } }
  /api/wireguard/peers/{name}:
    put:
      operationId: renameWireGuardPeer
      description: >-
        Renames the Peer while preserving its address, public key, client configuration,
        and access preset assignments.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/PeerName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
      responses:
        '200':
          description: Peer renamed without rotating its key
          content: { application/json: { schema: { type: object } } }
    delete:
      operationId: deleteWireGuardPeer
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/PeerName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: Must exactly match the peer name.
      responses:
        '200':
          description: Peer deleted
          content: { application/json: { schema: { type: object } } }
components:
  securitySchemes:
    basicAuth: { type: http, scheme: basic }
  parameters:
    Csrf:
      name: X-Relay-CSRF
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: CLI requires this for real changes; successful responses are replayable for 24 hours.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    PeerName:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 32 }
    AccessPresetName:
      name: name
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AccessPresetName' }
  schemas:
    AccessPresetName:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
    AccessItemName:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$'
    AccessChange:
      type: object
      description: Preview accepts action; mutation endpoints select action and target from their URL. group-create/update use name, preset_names, group_names, optional new_presets; assign uses peer_name and both assignment arrays. Apply requires revision. Group names and preset names are separate namespaces.
      properties:
        action: { type: string, enum: [group-create, group-update, group-delete, assign, preset-create, preset-update, preset-delete] }
        current_name: { $ref: '#/components/schemas/AccessItemName' }
        name: { $ref: '#/components/schemas/AccessItemName' }
        peer_name: { $ref: '#/components/schemas/AccessItemName' }
        preset_names: { type: array, items: { $ref: '#/components/schemas/AccessItemName' } }
        group_names: { type: array, items: { $ref: '#/components/schemas/AccessItemName' } }
        revision: { type: string }
        new_presets:
          type: array
          items:
            type: object
            required: [name, protocol, target_address, target_port]
            properties:
              name: { $ref: '#/components/schemas/AccessItemName' }
              protocol: { enum: [tcp, udp], type: string }
              target_address: { type: string, format: ipv4 }
              target_port: { type: integer, minimum: 1, maximum: 65535 }
    AccessPreview:
      type: object
      required: [revision, changes, safe]
      properties:
        revision: { type: string, description: SHA-256 revision of the state used for validation }
        safe: { const: true }
        changes:
          type: array
          items:
            type: object
            required: [peer_name, added, removed]
            properties:
              peer_name: { type: string }
              added: { type: array, items: { type: object, properties: { protocol: { type: string }, target_address: { type: string }, target_port: { type: integer } } } }
              removed: { type: array, items: { type: object, properties: { protocol: { type: string }, target_address: { type: string }, target_port: { type: integer } } } }
    WireGuardArtifact:
      type: object
      additionalProperties: false
      required:
        - ok
        - message
        - filename
        - client_config
        - one_time
        - qr_filename
        - qr_svg_base64
        - qr_warning
      properties:
        ok: { const: true }
        message: { type: string }
        filename: { type: string }
        client_config:
          type: string
          description: One-time WireGuard profile containing the client private key.
        one_time: { const: true }
        qr_filename: { type: string }
        qr_svg_base64:
          type: string
          contentEncoding: base64
          contentMediaType: image/svg+xml
        qr_warning:
          type: string
          description: Non-empty only when peer creation succeeded but QR generation failed.
  requestBodies:
    AccessPreset:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name, protocol, target_address, target_port]
            properties:
              name: { $ref: '#/components/schemas/AccessPresetName' }
              protocol: { type: string, enum: [tcp, udp] }
              target_address: { type: string, format: ipv4 }
              target_port: { type: integer, minimum: 1, maximum: 65535 }
    Route:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            required: [name, protocol, public_port, target_address, target_port]
            properties:
              name: { type: string }
              protocol: { type: string, enum: [tcp, udp] }
              public_port: { type: integer, minimum: 1, maximum: 65535 }
              target_address: { type: string, format: ipv4 }
              target_port: { type: integer, minimum: 1, maximum: 65535 }
              description: { type: string, maxLength: 120 }
              group_id: { type: [string, 'null'] }
              desired_enabled: { type: boolean, default: true }
  responses:
    Conflict:
      description: Desired-state conflict or conflicting idempotency-key reuse
      content: { application/json: { schema: { type: object } } }
