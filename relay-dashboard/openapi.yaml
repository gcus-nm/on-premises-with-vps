openapi: 3.1.0
info:
  title: OCI Relay Control API
  version: 1.1.0
  description: Private API shared by the Web UI and non-interactive CLI.
servers:
  - url: http://127.0.0.1:41800
security:
  - basicAuth: []
paths:
  /api/state:
    get:
      operationId: getState
      responses:
        '200':
          description: Desired/applied state, audit entries, and a CSRF token
          content: { application/json: { schema: { type: object } } }
  /api/preflight:
    get:
      operationId: runPreflight
      responses:
        '200':
          description: Environment checks
          content: { application/json: { schema: { type: object } } }
  /api/routes/validate:
    post:
      operationId: validateRouteCreate
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody: { $ref: '#/components/requestBodies/Route' }
      responses:
        '200':
          description: No-change validation and affected-target summary
          content: { application/json: { schema: { type: object } } }
  /api/routes:
    post:
      operationId: createRoute
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/Route' }
      responses:
        '201':
          description: Route staged; OCI is unchanged until plan/apply
          content: { application/json: { schema: { type: object } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/plan:
    post:
      operationId: createTerraformPlan
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Allowlisted Terraform plan metadata
          content: { application/json: { schema: { type: object } } }
  /api/apply:
    post:
      operationId: applyTerraformPlan
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties: { confirmation: { const: APPLY } }
      responses:
        '200':
          description: Terraform and relay synchronization completed
          content: { application/json: { schema: { type: object } } }
        '502':
          description: Failed or partially failed operation; response identifies completed work
          content: { application/json: { schema: { type: object } } }
  /api/sync:
    post:
      operationId: synchronizeRelay
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Relay synchronization result
          content: { application/json: { schema: { type: object } } }
components:
  securitySchemes:
    basicAuth: { type: http, scheme: basic }
  parameters:
    Csrf:
      name: X-Relay-CSRF
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: CLI requires this for real changes; successful responses are replayable for 24 hours.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
  requestBodies:
    Route:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            required: [name, protocol, public_port, target_address, target_port]
            properties:
              name: { type: string }
              protocol: { type: string, enum: [tcp, udp] }
              public_port: { type: integer, minimum: 1, maximum: 65535 }
              target_address: { type: string, format: ipv4 }
              target_port: { type: integer, minimum: 1, maximum: 65535 }
              description: { type: string, maxLength: 120 }
              group_id: { type: [string, 'null'] }
              desired_enabled: { type: boolean, default: true }
  responses:
    Conflict:
      description: Desired-state conflict or conflicting idempotency-key reuse
      content: { application/json: { schema: { type: object } } }
