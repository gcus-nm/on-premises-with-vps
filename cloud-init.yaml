#cloud-config
package_update: true
package_upgrade: false
packages:
  - wireguard
  - nftables

ssh_pwauth: false
disable_root: true

write_files:
  - path: /etc/sysctl.d/99-onprem-relay.conf
    owner: root:root
    permissions: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1

runcmd:
  - [sysctl, --system]

final_message: "Relay prerequisites installed after $UPTIME seconds"
